[project]
site_name = "qupath-mcp"
site_description = "Drive QuPath's GUI from an AI agent or a test script"
site_url = "https://earthmover-support.github.io/qupath-mcp/"
repo_url = "https://github.com/earthmover-support/qupath-mcp"
repo_name = "earthmover-support/qupath-mcp"
nav = [
  { "Home" = "index.md" },
  { "Install" = "install.md" },
  { "Tools" = "tools.md" },
  { "Security" = "security.md" },
  { "Contributing" = "contributing.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed = { alternate_style = true }

# Client registration tabs are shared by the home and install pages.
[project.markdown_extensions.pymdownx.snippets]
base_path = ["snippets"]
check_paths = true
